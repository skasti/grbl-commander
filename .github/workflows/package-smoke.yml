name: Native package smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/package-smoke.yml"
      - ".github/scripts/assert_msi_start_menu.ps1"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "core/build.gradle.kts"
      - "infrastructure/build.gradle.kts"
      - "app-desktop/build.gradle.kts"
      - "LICENSE.md"
      - "app-desktop/packaging/**"

permissions:
  contents: read

jobs:
  package:
    name: Native packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-tasks: ":app-desktop:packageDeb :app-desktop:packageRpm"
          - os: windows-latest
            gradle-tasks: ":app-desktop:packageMsi"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Install RPM packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build native packages for next patch version
        env:
          RELEASE_VERSION: "0.1.1"
        run: gradle ${{ matrix.gradle-tasks }} --no-daemon --stacktrace
      - name: Verify Linux packages include third-party license notices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=(app-desktop/build/compose/binaries/main/deb/*.deb)
          rpm=(app-desktop/build/compose/binaries/main/rpm/*.rpm)
          test -f "${deb[0]}"
          test -f "${rpm[0]}"
          debContents=$(dpkg-deb --contents "${deb[0]}")
          rpmContents=$(rpm -qpl "${rpm[0]}")
          for notice in THIRD_PARTY_NOTICES.txt APACHE-2.0.txt LGPL-3.0.txt GPL-3.0.txt OFL-1.1.txt SKIA.txt JSERIALCOMM_NOTICE.txt; do
            grep -Fq "$notice" <<< "$debContents"
            grep -Fq "$notice" <<< "$rpmContents"
            echo "Verified Linux legal resource: $notice"
          done
      - name: Verify Windows MSI contains Start menu shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/assert_msi_start_menu.ps1
