name: Native package smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/package-smoke.yml"
      - "build.gradle.kts"
      - "gradle.properties"
      - "app-desktop/build.gradle.kts"

permissions:
  contents: read

jobs:
  package:
    name: Native packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-tasks: ":app-desktop:packageDeb :app-desktop:packageRpm"
          - os: windows-latest
            gradle-tasks: ":app-desktop:packageMsi"
          - os: macos-latest
            gradle-tasks: ":app-desktop:packageDmg"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Install RPM packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build native packages for next patch version
        env:
          RELEASE_VERSION: "0.1.1"
        run: gradle ${{ matrix.gradle-tasks }} --no-daemon --stacktrace
      - name: Verify Windows MSI contains Start menu shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/assert_msi_start_menu.ps1
