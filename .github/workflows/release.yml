name: Release

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  actions: read

concurrency:
  group: grbl-commander-release
  cancel-in-progress: false

jobs:
  recover-initial-release:
    name: Restore the unpublished v0.1.1 release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      # One-time recovery for the first merged release PR, whose installers built
      # successfully but were not published due to nested artifact directories.
      # This step is safe to retry and can be removed after v0.1.1 is published.
      - name: Restore v0.1.1 from the successful packaging jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo "v0.1.1 already published; no recovery required."
            exit 0
          fi
          gh run download 42681459338 --pattern 'release-*' --dir recovered-assets
          python3 .github/scripts/stage_release_assets.py recovered-assets recovered-files
          gh release create v0.1.1 recovered-files/* \
            --target 6e1d110df9b17386513cf3f1624083ef8104dbdf \
            --title "GRBL Commander v0.1.1" \
            --generate-notes

  prepare:
    name: Determine release version
    needs: recover-initial-release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - name: Calculate release version
        id: version
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 .github/scripts/release_version.py next
      - name: Test versioning rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  package:
    name: Package (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            gradle-tasks: ":app-desktop:packageDeb :app-desktop:packageRpm"
            paths: |
              app-desktop/build/compose/binaries/main/deb/*.deb
              app-desktop/build/compose/binaries/main/rpm/*.rpm
          - os: windows-latest
            name: windows
            gradle-tasks: ":app-desktop:packageMsi"
            paths: app-desktop/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            name: macos
            gradle-tasks: ":app-desktop:packageDmg"
            paths: app-desktop/build/compose/binaries/main/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Install RPM packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build, test, and package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gradle :app-desktop:build ${{ matrix.gradle-tasks }} --no-daemon --stacktrace
      - name: Upload native installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate and flatten native installers
        run: python3 .github/scripts/stage_release_assets.py release-assets release-files
      - name: Create tagged release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          gh release create "$TAG" release-files/* \
            --target "$MERGE_SHA" \
            --title "GRBL Commander $TAG" \
            --generate-notes
